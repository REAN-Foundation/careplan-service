
name: Harbor-UAT-CI-CD

on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:

jobs:
  Build-Push-Harbor:
    environment: uat
    runs-on: [self-hosted, linux, x64, rean-dev-runner]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Declare variables
        id: vars
        shell: bash
        run: |
          BRANCH=$(echo "${GITHUB_REF#refs/heads/}" | sed 's/\//-/g')
          SHA_SHORT=$(git rev-parse --short HEAD)
          REPO_NAME=$(echo "$GITHUB_REPOSITORY" | awk -F / '{print $2}')

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "sha_short=$SHA_SHORT" >> "$GITHUB_OUTPUT"
          echo "repo_name=$REPO_NAME" >> "$GITHUB_OUTPUT"

      - name: Print Branch Details
        run: |
          echo "Branch: ${{ steps.vars.outputs.branch }}"
          echo "Sha: ${{ steps.vars.outputs.sha_short }}"
          echo "Repo: ${{ steps.vars.outputs.repo_name }}"

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: artifacts.reanfoundation.org
          username: ${{ secrets.GHR_HARBOR_USERNAME }}
          password: ${{ secrets.GHR_HARBOR_PASSWORD }}

      - name: Build and push to Harbor
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./Dockerfile
          builder: ${{ steps.buildx.outputs.name }}
          push: true
          tags: artifacts.reanfoundation.org/rean-dev/careplan-service-dev-uat:sb.${{ steps.vars.outputs.branch }}_${{ steps.vars.outputs.sha_short }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache

      - name: Image digest
        run: echo "${{ steps.docker_build.outputs.digest }}"
